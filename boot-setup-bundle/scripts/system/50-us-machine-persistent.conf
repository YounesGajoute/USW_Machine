# Persistent journals so previous-boot / last-shutdown logs survive reboot.
# Drop-in for /etc/systemd/journald.conf.d/ (overrides Storage=volatile).
#
# Size caps keep SD-card wear bounded on Raspberry Pi.

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=100M
SystemKeepFree=200M
SystemMaxFileSize=20M
MaxRetentionSec=14day
RuntimeMaxUse=50M
