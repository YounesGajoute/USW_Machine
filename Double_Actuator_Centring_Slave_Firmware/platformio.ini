; Double Actuator Centring Slave Firmware
; Target: Arduino Nano ATmega328P (PlatformIO on Linux / Raspberry Pi)

[platformio]
default_envs = double_actuator_centring_slave

[env:double_actuator_centring_slave]
platform = atmelavr@5.3.0
framework = arduino
board = nanoatmega328

; Shrink EthernetENC: stub DNS / hostByName (static-IP slave only)
extra_scripts = pre:scripts/flash_opt.py

build_flags =
    -Os
    ; Measured size wins with pinned AVR GCC; see FLASH_OPTIMIZATION.md.
    -fno-split-wide-types
    -fno-move-loop-invariants
    -mstrict-X
    -fno-tree-loop-optimize
    -ffunction-sections
    -fdata-sections
    -mcall-prologues
    -flto
    -fmerge-all-constants
    -finline-limit=8
    -Wl,--gc-sections
    -Wl,--print-memory-usage
    -DUIP_CONF_UDP=0
    -DUIP_CONF_MAX_CONNECTIONS=2
    -DUIP_SOCKET_NUMPACKETS=2
    -DUIP_CONF_MAX_LISTENPORTS=1
    ; EthernetENC defaults to 2000 ms, equal to the hardware watchdog period.
    ; A blocked reply must fail the session, not reset the Nano mid-motion.
    -DUIP_WRITE_TIMEOUT=100

lib_deps =
    arduino-libraries/Servo@1.3.0
    jandrassy/EthernetENC@2.0.5

; Centring Nano: stable USB topology, verified during separate jaw calibration.
upload_port = /dev/serial/by-path/platform-xhci-hcd.0-usb-0:1.3:1.0-port0
monitor_port = /dev/serial/by-path/platform-xhci-hcd.0-usb-0:1.3:1.0-port0
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_eol = LF
monitor_filters = printable

; Manual servo jog / position tool (USB serial only — no Ethernet).
; Restore production: pio run -e double_actuator_centring_slave -t upload
[env:servo_jog]
platform = atmelavr
framework = arduino
board = nanoatmega328
build_src_filter = -<*> +<../tools/servo_jog/>
lib_deps =
    arduino-libraries/Servo@^1.2.1
upload_port = /dev/ttyUSB2
monitor_port = /dev/ttyUSB2
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_eol = LF
monitor_filters = printable

; Dedicated, opt-in USB calibration. No production flash patches or Ethernet.
; Explicit upload port required: never guess between the machine's controllers.
[env:calibration_pwm]
platform = atmelavr@5.3.0
framework = arduino
board = nanoatmega328
build_src_filter = -<*> +<../tools/calibration_pwm/>
build_flags = -Os
lib_deps = arduino-libraries/Servo@1.3.0
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
