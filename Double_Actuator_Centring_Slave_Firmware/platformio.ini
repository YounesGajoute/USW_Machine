; Double Actuator Centring Slave Firmware
; Target: Arduino Nano ATmega328P (PlatformIO on Linux / Raspberry Pi)

[platformio]
default_envs = double_actuator_centring_slave

[env:double_actuator_centring_slave]
platform = atmelavr
framework = arduino
board = nanoatmega328

; Shrink EthernetENC: stub DNS / hostByName (static-IP slave only)
extra_scripts = pre:scripts/flash_opt.py

build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -mcall-prologues
    -flto
    -fmerge-all-constants
    -finline-limit=8
    -Wl,--gc-sections
    -Wl,--print-memory-usage
    -DUIP_CONF_UDP=0
    -DUIP_CONF_MAX_CONNECTIONS=2
    -DUIP_SOCKET_NUMPACKETS=2
    -DUIP_CONF_MAX_LISTENPORTS=1

lib_deps =
    arduino-libraries/Servo@^1.2.1
    jandrassy/EthernetENC@^2.0.5

; Nano verified on this host as USB2.0-Serial (LOCATION=4-1.4)
upload_port = /dev/ttyUSB2
monitor_port = /dev/ttyUSB2
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_eol = LF
monitor_filters = printable

; Manual servo jog / position tool (USB serial only — no Ethernet).
; Restore production: pio run -e double_actuator_centring_slave -t upload
[env:servo_jog]
platform = atmelavr
framework = arduino
board = nanoatmega328
build_src_filter = -<*> +<../tools/servo_jog/>
lib_deps =
    arduino-libraries/Servo@^1.2.1
upload_port = /dev/ttyUSB2
monitor_port = /dev/ttyUSB2
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_eol = LF
monitor_filters = printable
