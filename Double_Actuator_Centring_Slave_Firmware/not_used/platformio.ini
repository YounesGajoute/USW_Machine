; Centring dual-servo — Arduino Nano (upper/lower servo modules), SERIAL ONLY.
; Text line protocol @ USB serial 115200. No ENC28J60 / no TCP in this project.
;
; centring_nano_serial = USB serial communication build (the only environment).
;
; Build / upload:
;   cd centring_systeme
;   py -m platformio run -e centring_nano_serial -t upload
; Monitor:
;   py -m platformio device monitor -e centring_nano_serial

[platformio]
default_envs = centring_nano_serial

[env:centring_nano_serial]
platform = atmelavr
framework = arduino
board = nanoatmega328
build_flags =
    -DSERIAL_ONLY=1
    -Os
    -ffunction-sections
    -fdata-sections
    -flto
    -Wl,--gc-sections
    -Wl,--print-memory-usage
lib_deps =
    arduino-libraries/Servo@^1.2.1
upload_port = COM4
upload_speed = 115200
monitor_port = COM4
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_eol = LF
monitor_filters = printable
