; Centring dual-servo — Arduino Nano + ENC28J60 (upper/lower servo modules)
; Text line protocol @ TCP 8177 (centring_nano) or serial 115200 (centring_nano_motor)
;
; centring_nano       = Ethernet TCP production (192.168.10.55:8177)
; centring_nano_motor = USB serial debug (no ENC28J60)
; centring_nano_bench = USB bench: switch inputs + servo direction sweeps
; centring_nanonew    = new bootloader variant
;
; Build / upload:
;   cd New_centring_systeme_nano
;   py -m platformio run -e centring_nano_motor -t upload
; Monitor:
;   py -m platformio device monitor -e centring_nano_motor

[platformio]
default_envs = centring_nano_motor

[env]
upload_port = COM4
upload_speed = 115200
lib_deps =
    https://github.com/njh/EtherCard.git
    arduino-libraries/Servo@^1.2.1

[env:centring_nano]
platform = atmelavr
framework = arduino
board = nanoatmega328
extra_scripts = pre:scripts/patch_ethercard.py
build_flags =
    -DETH_ONLY=1
    -DHOMING_SINGLE_AXIS=0
    -DETHERCARD_DHCP=0
    -DETHERCARD_TCPCLIENT=0
    -DETHERCARD_UDPSERVER=0
    -DETHERCARD_STASH=0
    -DSERIAL_RX_BUFFER_SIZE=2
    -DSERIAL_TX_BUFFER_SIZE=2
    -Os
    -ffunction-sections
    -fdata-sections
    -flto
    -Wl,--gc-sections
    -Wl,--print-memory-usage
build_src_filter = +<*> -<bench_test_main.cpp>

[env:centring_nano_motor]
platform = atmelavr
framework = arduino
board = nanoatmega328
build_flags =
    -DMOTOR_ONLY=1
    -DHOMING_SINGLE_AXIS=0
    -Os
    -ffunction-sections
    -fdata-sections
    -flto
    -Wl,--gc-sections
    -Wl,--print-memory-usage
build_src_filter = +<*> -<bench_test_main.cpp>
lib_deps =
    arduino-libraries/Servo@^1.2.1
monitor_port = COM4
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_eol = LF
monitor_filters = printable

[env:centring_nano_bench]
platform = atmelavr
framework = arduino
board = nanoatmega328
build_flags =
    -DBENCH_TEST=1
    -Os
    -ffunction-sections
    -fdata-sections
    -flto
    -Wl,--gc-sections
    -Wl,--print-memory-usage
lib_deps =
    arduino-libraries/Servo@^1.2.1
build_src_filter = -<main.cpp> +<bench_test_main.cpp>
monitor_port = COM4
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_eol = LF
monitor_filters = printable

[env:centring_nanonew]
extends = env:centring_nano
board = nanoatmega328new
