# Stock lightdm.service has Conflicts=plymouth-quit.service so the DM and that
# unit cannot be scheduled together — stock plymouth-quit is masked. Boot-wait
# only gates on HTTP + min splash (keeps Plymouth). Quit happens in
# us-machine-plymouth-quit-after-lightdm.service after LightDM starts.
[Unit]
After=us-machine-headless-web.service us-machine-plymouth-boot-wait.service
Requires=us-machine-plymouth-boot-wait.service
Wants=us-machine-headless-web.service us-machine-plymouth-quit-after-lightdm.service
