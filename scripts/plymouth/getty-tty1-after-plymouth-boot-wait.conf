# Getty on tty1 must not draw until Plymouth has handed off to LightDM/kiosk.
# Ordering only on boot-wait (HTTP ready) was too early: agetty painted the
# login/IP console between splash quit and the compositor. Wait for the quit
# unit that runs after LightDM.
[Unit]
After=us-machine-plymouth-boot-wait.service us-machine-plymouth-quit-after-lightdm.service lightdm.service
Requires=us-machine-plymouth-boot-wait.service
