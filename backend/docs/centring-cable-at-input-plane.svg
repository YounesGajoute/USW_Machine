<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60.0 90.0 680.0 340.0" width="680" height="340" role="img" aria-labelledby="title">
  <title id="title">Centring frame: Wa/Wb/L, cable // side A, jaws centre RBK</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <pattern id="insRed" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#B83020"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#902010" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <pattern id="insGrn" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#2A8A30"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#106020" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <linearGradient id="rbkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="45%" stop-color="#111"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
  </defs>

  <rect x="-60.0" y="90.0" width="680.0" height="340.0" fill="#f4f6f8"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Frame taper Wa -> Wb over L -->
    <path d="M 130.0 360 L 252.5 160 L 307.5 160 L 430.0 360 Z"
          fill="#dce3ea" stroke="#5a6a78" stroke-width="1.5" opacity="0.85"/>
    <path d="M 130.0 360 L 252.5 160" fill="none" stroke="#5a6a78" stroke-width="2.5"/>
    <path d="M 430.0 360 L 307.5 160" fill="none" stroke="#5a6a78" stroke-width="2.5"/>

    <!-- Machine centerline -->
    <line x1="280" y1="140" x2="280" y2="380"
          stroke="#1a5f9e" stroke-width="1" stroke-dasharray="6 4" opacity="0.75"/>

    <!-- side B OUTPUT -->
    <line x1="227.5" y1="160" x2="332.5" y2="160"
          stroke="#2d7a3e" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="280" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#2d7a3e">
      side B / OUTPUT  Wb = sideB_guide_spacing_mm = 40
    </text>

    <!-- side A INPUT -->
    <line x1="15.0" y1="360" x2="545.0" y2="360"
          stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="280" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">
      side A / INPUT  Wa = sideA_guide_spacing_mm = 300
    </text>

    <!-- Wa dimension -->
    <line x1="130.0" y1="398" x2="430.0" y2="398"
          stroke="#111" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="280" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Wa = 300 mm</text>

    <!-- Wb dimension -->
    <line x1="252.5" y1="132" x2="307.5" y2="132"
          stroke="#111" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="280" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Wb = 40 mm</text>

    <!-- L dimension -->
    <line x1="465.0" y1="360" x2="465.0" y2="160"
          stroke="#111" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="478.0" y="260.0" text-anchor="middle" transform="rotate(90 478.0 260.0)"
          font-size="11" font-weight="700" fill="#111">L = module_length_mm = 200</text>

    <!-- offset into zone (centering_input_offset illustration) -->
    <line x1="90.0" y1="360" x2="90.0" y2="310"
          stroke="#6a3d9a" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="78.0" y="335.0" text-anchor="middle" transform="rotate(-90 78.0 335.0)"
          font-size="10" font-weight="600" fill="#6a3d9a">offset = 50 mm</text>

    <!-- Jaws / guides -->
    <g id="jaws">
      <path d="M 168.6 335 L 188.6 285" fill="none" stroke="#e67e00" stroke-width="4" stroke-linecap="round"/>
      <path d="M 391.4 335 L 371.4 285" fill="none" stroke="#e67e00" stroke-width="4" stroke-linecap="round"/>
      <polygon points="125.6,310.0 155.6,298.0 155.6,322.0" fill="#e67e00"/>
      <polygon points="434.4,310.0 404.4,298.0 404.4,322.0" fill="#e67e00"/>
    </g>
    <text x="110.6" y="280" text-anchor="end" font-size="10" font-weight="600" fill="#e67e00">jaw / guide</text>
    <text x="449.4" y="280" text-anchor="start" font-size="10" font-weight="600" fill="#e67e00">jaw / guide</text>
    <text x="280" y="268" text-anchor="middle" font-size="10" fill="#8a6200">jaws centre RBK to middle (gap path)</text>

    <!-- Assembly: cable // side A -->
    <g id="assembly">
      <rect x="30.0" y="304.0" width="220" height="12" rx="6.0"
            fill="url(#insRed)" stroke="#8B1A10" stroke-width="1"/>
      <rect x="250.0" y="296.0" width="60" height="28" rx="3"
            fill="url(#rbkGrad)" stroke="#000" stroke-width="1"/>
      <rect x="310.0" y="304.0" width="220" height="12" rx="6.0"
            fill="url(#insGrn)" stroke="#1A6B18" stroke-width="1"/>
    </g>
    <text x="70.0" y="338" font-size="10" fill="#8B1A10">wire L</text>
    <text x="280" y="338" text-anchor="middle" font-size="10" font-weight="700" fill="#111">RBK (L_eff ex. 60 mm)</text>
    <text x="480.0" y="338" text-anchor="end" font-size="10" fill="#1A6B18">wire R</text>

    <!-- Ghost at B -->
    <g opacity="0.28">
      <rect x="250" y="156" width="20" height="8" rx="4" fill="#B83020"/>
      <rect x="268" y="152" width="24" height="16" rx="2" fill="#111"/>
      <rect x="290" y="156" width="20" height="8" rx="4" fill="#2A7A30"/>
    </g>

    <!-- Travel from INPUT (start), not from pickup -->
    <line x1="448" y1="360" x2="448" y2="164.1"
          stroke="#1a5f9e" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="500" y="262" text-anchor="middle" transform="rotate(90 500 262)"
          font-size="10" font-weight="700" fill="#1a5f9e">centering_travel ~195.9 mm FROM INPUT</text>

    <text x="280" y="200" text-anchor="middle" font-size="10" fill="#1a5f9e">
      travel = L*(Wa-L_eff)/(Wa-Wb) from INPUT (start)  |  NOT from pickup
    </text>
    <text x="280" y="216" text-anchor="middle" font-size="10" fill="#444">
      centering_output = start + travel | centering_input = start + offset
    </text>
  </g>
</svg>
